<!DOCTYPE html>
<html>
    <head>
        <title>Login Page</title>
        <link rel="stylesheet" href="./Gemini-correct-loginpage.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="page-container">
            <div class="header">IIElevenLabs</div>
            
            <div class="form-container">
                <h2 class="form-element header-title">Create Account</h2>
                
                <button class="form-element google-btn"> 
                    <img src="./png-transparent-google-logo-google-text-trademark-logo-thumbnail.png" alt="google logo" height="20px" width="20px">
                    Sign up with Google
                </button>
                
                <label class="form-element">Email</label>
                <input class="form-element input-field" type="text" placeholder="">
                
                <label class="form-element">Password</label>
                <input class="form-element input-field" type="password">
                
                <button class="form-element submit-btn">Sign Up</button>
                
                <p class="form-element login-redirect">Already registered? <a href="./">Sign in</a></p>
            </div>
            
            <div class="footer">By continuing you agree to our Terms of Services and Privacy Policy</div>
        </div>
    </body>
</html>
